<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>共读积分查询</title>
<style>
  :root {
    --bg: #f7f4ef;
    --card: #ffffff;
    --primary: #4a7c59;
    --primary-light: #e8f0e9;
    --text: #2c2c2c;
    --text-light: #888;
    --border: #e8e3db;
    --accent: #d4a853;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 500px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }

  .header {
    text-align: center;
    padding: 32px 0 24px;
  }
  .header .icon { font-size: 48px; margin-bottom: 8px; }
  .header h1 { font-size: 22px; font-weight: 700; color: var(--text); letter-spacing: 1px; }
  .header .subtitle { font-size: 13px; color: var(--text-light); margin-top: 4px; }

  .stats-bar {
    display: flex;
    justify-content: center;
    padding: 14px 0;
    margin-bottom: 16px;
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .stat-item { text-align: center; }
  .stat-num { font-size: 22px; font-weight: 700; color: var(--primary); }
  .stat-label { font-size: 11px; color: var(--text-light); margin-top: 2px; }

  /* 排行榜 */
  .leaderboard {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 20px;
    margin-bottom: 16px;
  }
  .leaderboard-title {
    font-size: 13px; font-weight: 600; color: var(--text-light);
    margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
  }
  .lb-list { list-style: none; }
  .lb-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0;
  }
  .lb-item + .lb-item { border-top: 1px solid #f5f2ec; }
  .lb-rank {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700; flex-shrink: 0;
  }
  .lb-rank.gold   { background: #fff8e1; color: #f9a825; }
  .lb-rank.silver { background: #f5f5f5; color: #9e9e9e; }
  .lb-rank.bronze { background: #fbe9e7; color: #d84315; }
  .lb-nickname {
    flex: 1; font-size: 14px; font-weight: 500;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .lb-duration {
    font-size: 13px; font-weight: 700; color: var(--accent);
    flex-shrink: 0;
  }

  .search-box {
    background: var(--card);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .search-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
    background: #f5f2ec;
    border-radius: 12px;
    padding: 2px;
    border: 2px solid transparent;
    transition: border-color 0.2s;
  }
  .search-input-wrap:focus-within { border-color: var(--primary); background: #fff; }
  .search-icon { padding: 0 12px; font-size: 18px; color: var(--text-light); flex-shrink: 0; }
  .search-input-wrap input {
    flex: 1; border: none; background: transparent;
    padding: 14px 8px; font-size: 16px; color: var(--text); outline: none; min-width: 0;
  }
  .search-input-wrap input::placeholder { color: #bbb; }
  .search-input-wrap button {
    flex-shrink: 0; margin: 2px; padding: 10px 20px;
    background: var(--primary); color: #fff; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background 0.2s, transform 0.1s; white-space: nowrap;
  }
  .search-input-wrap button:active { transform: scale(0.96); background: #3d6b4a; }

  /* Result Card */
  .result-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .result-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  .result-avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--primary-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .result-info { flex: 1; min-width: 0; }
  .result-nickname { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-meta { font-size: 12px; color: var(--text-light); margin-top: 2px; }
  .result-score-row {
    display: flex; gap: 12px; padding: 4px 20px 14px;
    border-bottom: 1px solid var(--border);
    align-items: flex-end;
  }
  .result-score-cell {
    flex: 1; text-align: center;
    padding: 8px 4px;
  }
  .result-score-cell + .result-score-cell {
    border-left: 1px solid #f0ede5;
  }
  .result-score-num { font-size: 28px; font-weight: 700; color: var(--primary); line-height: 1.1; }
  .result-score-num.accent { color: var(--accent); }
  .result-score-num.large { font-size: 36px; }
  .result-score-label { font-size: 11px; color: var(--text-light); margin-top: 4px; }
  .result-duration-row {
    text-align: center; padding: 10px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .result-duration-num { font-size: 20px; font-weight: 700; color: var(--accent); }
  .result-duration-unit { font-size: 12px; font-weight: 400; margin-left: 2px; }
  .result-duration-label { font-size: 11px; color: var(--text-light); margin-top: 2px; }

  /* 书目分组 */
  .books-section {
    border-top: 1px solid var(--border);
  }
  .books-section-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px 8px;
  }
  .books-section-title {
    font-size: 13px; font-weight: 600; color: var(--text-light);
    display: flex; align-items: center; gap: 6px;
  }
  .section-badge {
    display: inline-block; padding: 2px 8px;
    border-radius: 10px; font-size: 11px; font-weight: 600;
  }
  .badge-fixed { background: #e8f0e9; color: #4a7c59; }
  .badge-flow { background: #fdf6e8; color: #a07830; }

  /* 每本书一行 */
  .book-row {
    display: flex; align-items: center;
    padding: 11px 20px;
    border-top: 1px solid #f5f2ec;
    gap: 10px;
  }
  .book-row:first-of-type { border-top: none; }
  .book-icon { font-size: 15px; flex-shrink: 0; }
  .book-name-wrap { flex: 1; overflow: hidden; }
  .book-name {
    font-size: 14px; font-weight: 500;
    overflow: hidden; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    line-height: 1.4;
  }
  .book-type-line { margin-top: 4px; }
  .book-type-tag {
    display: inline-block; font-size: 11px; padding: 1px 7px;
    border-radius: 10px; font-weight: 500;
  }
  .tag-fixed { background: #e8f5e9; color: #388e3c; }
  .tag-flow  { background: #fff3e0; color: #e65100; }
  .tag-week  { background: #e3f2fd; color: #1565c0; }
  .book-duration {
    flex-shrink: 0; text-align: right; min-width: 60px;
  }
  .book-duration .dur-num { font-size: 13px; font-weight: 700; color: var(--accent); }
  .book-duration .dur-unit { font-size: 11px; color: var(--text-light); }
  .book-score { flex-shrink: 0; text-align: right; min-width: 36px; font-size: 12px; color: var(--primary); font-weight: 600; }

  /* 历史月份折叠 */
  .past-month-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    border-top: 1px solid #f5f2ec;
    cursor: pointer; user-select: none;
    transition: background 0.15s;
  }
  .past-month-row:hover { background: #fafaf8; }
  .past-month-left { display: flex; align-items: center; gap: 8px; }
  .past-month-label { font-size: 14px; font-weight: 600; }
  .past-month-total { font-size: 13px; color: var(--primary); font-weight: 600; }
  .past-month-right { display: flex; align-items: center; gap: 4px; }
  .past-month-toggle {
    font-size: 12px; color: var(--text-light);
    transition: transform 0.2s;
  }
  .past-month-row.open .past-month-toggle { transform: rotate(90deg); }
  .past-month-detail { display: none; }
  .past-month-detail.open { display: block; }

  /* Multi-match & not found */
  .detail-item {
    padding: 14px 20px; border-bottom: 1px solid #f5f2ec;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    cursor: pointer;
  }
  .detail-item:last-child { border-bottom: none; }
  .detail-book { font-size: 14px; font-weight: 500; }
  .detail-time { font-size: 12px; color: var(--text-light); margin-top: 3px; }
  .detail-score { font-size: 17px; font-weight: 700; color: var(--accent); flex-shrink: 0; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-light); }
  .empty-state .emoji { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  .not-found { text-align: center; padding: 32px 20px; color: var(--text-light); }
  .not-found .emoji { font-size: 40px; margin-bottom: 8px; }
  .not-found p { font-size: 14px; }
  .not-found .hint { font-size: 12px; color: #bbb; margin-top: 6px; }

  .footer { text-align: center; padding: 24px 0; font-size: 12px; color: #ccc; }

  @media (max-width: 380px) {
    .container { padding: 12px 10px 30px; }
    .header { padding: 20px 0 16px; }
    .result-score-num { font-size: 26px; }
    .search-input-wrap input { font-size: 14px; padding: 12px 6px; }
    .search-input-wrap button { padding: 8px 14px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="icon">📚</div>
    <h1>共读积分查询</h1>

  <div id="resultArea"></div>

  <div class="footer">
    数据每周五下午更新 · 如有疑问请联系小芸（工作日9:00-17:00在线）
  </div>
</div>

  const ranked = userData.map(u => {
    let total = 0;
    (u.records || []).forEach(r => {
      if (r.book_month === curMonth) total += (r.duration || 0);
    });
    return { nickname: u.nickname, total };
  }).filter(x => x.total > 0)
    .sort((a, b) => b.total - a.total)
    .slice(0, 3);

  const lb = document.getElementById('leaderboard');
  const list = document.getElementById('lbList');
  if (!ranked.length) { lb.style.display = 'none'; return; }
  lb.style.display = 'block';

  // 更新标题
  lb.querySelector('.leaderboard-title').textContent = '🏆 ' + curMonthLabel + '阅读时长排行 TOP 3';

  const medals = ['gold', 'silver', 'bronze'];
  const icons  = ['🥇', '🥈', '🥉'];
  list.innerHTML = ranked.map((x, i) => `
    <li class="lb-item">
      <div class="lb-rank ${medals[i]}">${icons[i]}</div>
      <span class="lb-nickname">${escapeHtml(x.nickname)}</span>
      <span class="lb-duration">${fmtH(x.total)}</span>
    </li>
  `).join('');
}

// ========== 时长格式化 ==========
function fmtDuration(hours) {
  if (!hours || hours <= 0) return null;
  return { num: hours.toFixed(1) + '小时', unit: '' };
}

// ========== 搜索 ==========
function doSearch() {
  const input = document.getElementById('searchInput').value.trim();
  if (!input) return;
  let user = nicknameIndex[input.toLowerCase()];
  if (!user) {
    const matches = userData.filter(u => u.nickname.toLowerCase().includes(input.toLowerCase()));
    if (matches.length === 0) { showNotFound(input); return; }
    if (matches.length === 1) { user = matches[0]; }
    else { showMultipleMatches(matches, input); return; }
  }
  if (user) showResult(user);
}

function quickSearch(nickname) {
  document.getElementById('searchInput').value = nickname;
  doSearch();
}

// ========== 结果展示 ==========
function showResult(user) {
  const lastDate = user.last_submit ? user.last_submit.split(' ')[0] : '--';
  const records = user.records || [];

  // 当前月份
  const now = new Date();
  const curMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  const curMonthLabel = curMonth.replace('-', '年') + '月';

  // 当月 / 历史
  const curRecords = records.filter(r => r.book_month === curMonth);
  const pastRecords = records.filter(r => r.book_month !== curMonth);

  // 当月总时长
  const curTotalH = curRecords.reduce((s, r) => s + (r.duration || 0), 0);

  let html = '<div class="result-card">';

  // ========== 头部：昵称 + 最近打卡 ==========
  html += `
    <div class="result-header">
      <div class="result-avatar">📖</div>
      <div class="result-info">
        <div class="result-nickname">${escapeHtml(user.nickname)}</div>
        <div class="result-meta">最近打卡 ${lastDate} · 共${user.record_count}次</div>
      </div>
    </div>`;

  // ========== 积分行 ==========
  html += `
    <div class="result-score-row">
      <div class="result-score-cell">
        <div class="result-score-num">${Math.round(user.total_score)}</div>
        <div class="result-score-label">获得积分</div>
      </div>
      <div class="result-score-cell">
        <div class="result-score-num large accent">${Math.round(user.available_score)}</div>
        <div class="result-score-label">可使用积分</div>
      </div>
      <div class="result-score-cell">
        <div class="result-score-num">${Math.round(user.used_score)}</div>
        <div class="result-score-label">已使用积分</div>
      </div>
    </div>`;

  // ========== 当月时长行 ==========
  html += `
    <div class="result-duration-row">
      <div class="result-duration-num">${curTotalH.toFixed(1)}<span class="result-duration-unit">小时</span></div>
      <div class="result-duration-label">${curMonthLabel}共读总时长</div>
    </div>`;

  // ========== 当月书目：固定/流动分类，无小计 ==========
  if (curRecords.length > 0) {
    const curFixed = curRecords.filter(r => r.book_type === '固定书目');
    const curFlow  = curRecords.filter(r => r.book_type === '流动书目');

    if (curFixed.length > 0) {
      html += '<div class="books-section">';
      html += '<div class="books-section-header"><div class="books-section-title"><span class="section-badge badge-fixed">固定书目</span></div></div>';
      curFixed.forEach(r => {
        const d = fmtDuration(r.duration);
        html += `<div class="book-row">
          <span class="book-icon">📗</span>
          <div class="book-name-wrap"><div class="book-name">${escapeHtml(r.book)}</div></div>
          <div class="book-duration">${d ? `<div class="dur-num">${d.num}</div>` : '<div class="dur-num" style="color:#ccc">--</div>'}</div>
          <div class="book-score">${r.total_score}分</div>
        </div>`;
      });
      html += '</div>';
    }
    if (curFlow.length > 0) {
      html += '<div class="books-section">';
      html += '<div class="books-section-header"><div class="books-section-title"><span class="section-badge badge-flow">流动书目</span></div></div>';
      curFlow.forEach(r => {
        const d = fmtDuration(r.duration);
        const weekTag = r.book_remark ? `<span class="book-type-tag tag-week">${escapeHtml(r.book_remark)}</span>` : '';
        html += `<div class="book-row">
          <span class="book-icon">📙</span>
          <div class="book-name-wrap">
            <div class="book-name">${escapeHtml(r.book)}</div>
            <div class="book-type-line">${weekTag}</div>
          </div>
          <div class="book-duration">${d ? `<div class="dur-num">${d.num}</div>` : '<div class="dur-num" style="color:#ccc">--</div>'}</div>
          <div class="book-score">${r.total_score}分</div>
        </div>`;
      });
      html += '</div>';
    }
  }

  // ========== 历史月份：折叠 ==========
  if (pastRecords.length > 0) {
    const byMonth = {};
    pastRecords.forEach(r => {
      const m = r.book_month || '未知';
      if (!byMonth[m]) byMonth[m] = [];
      byMonth[m].push(r);
    });
    const sortedMonths = Object.keys(byMonth).sort().reverse();
    let monthIdx = 0;
    sortedMonths.forEach(m => {
      const recs = byMonth[m];
      const total = recs.reduce((s, r) => s + (r.duration || 0), 0);
      const label = m && m.length >= 7 ? m.replace('-', '年') + '月' : m;
      const mid = 'pastMonth' + (monthIdx++);

      html += '<div class="books-section">';
      html += `<div class="past-month-row" id="${mid}_row" onclick="togglePastMonth('${mid}')">
        <div class="past-month-left">
          <span>📅</span>
          <span class="past-month-label">${label}</span>
        </div>
        <div class="past-month-right">
          <span class="past-month-total">${fmtH(total)}</span>
          <span class="past-month-toggle">▶</span>
        </div>
      </div>`;
      html += `<div class="past-month-detail" id="${mid}_detail">`;
      recs.forEach(r => {
        const d = fmtDuration(r.duration);
        const icon = r.book_type === '固定书目' ? '📗' : '📙';
        const typeLabel = r.book_type === '固定书目'
          ? '<span class="book-type-tag tag-fixed">固定书目</span>'
          : (r.book_remark ? `<span class="book-type-tag tag-week">${escapeHtml(r.book_remark)}</span>` : '<span class="book-type-tag tag-flow">流动书目</span>');
        html += `<div class="book-row">
          <span class="book-icon">${icon}</span>
          <div class="book-name-wrap">
            <div class="book-name">${escapeHtml(r.book)}</div>
            <div class="book-type-line">${typeLabel}</div>
          </div>
          <div class="book-duration">
            ${d ? `<div class="dur-num">${d.num}</div>` : '<div class="dur-num" style="color:#ccc">--</div>'}
          </div>
          <div class="book-score">${r.total_score}分</div>
        </div>`;
      });
      html += '</div></div>';
    });
  }

  if (records.length === 0) {
    html += '<div style="padding:20px;text-align:center;color:#aaa;font-size:14px;">暂无打卡记录</div>';
  }

  html += '</div>';
  document.getElementById('resultArea').innerHTML = html;
}

// 时长格式化：显示 X.X小时
function fmtH(hours) {
  if (!hours || hours <= 0) return '0小时';
  return hours.toFixed(1) + '小时';
}

function showNotFound(query) {
  document.getElementById('resultArea').innerHTML = `
    <div class="not-found">
      <div class="emoji">🤔</div>
      <p>未找到「${escapeHtml(query)}」的积分记录</p>
      <p class="hint">请检查昵称是否输入正确（注意大小写、空格、emoji）</p>
    </div>`;
}

function showMultipleMatches(matches, query) {
  let html = '<div class="result-card"><div style="padding:16px 20px;font-size:14px;color:#888;">找到多个匹配「<b>' + escapeHtml(query) + '</b>」的书友：</div>';
  matches.forEach(u => {
    html += `<div class="detail-item" onclick="quickSearch('${escapeHtml(u.nickname)}')">
      <div>
        <div class="detail-book">${escapeHtml(u.nickname)}</div>
        <div class="detail-time">${u.record_count}次打卡</div>
      </div>
      <div class="detail-score">${Math.round(u.total_score)}分${u.used_score > 0 ? ' / 可用'+Math.round(u.available_score)+'分' : ''}</div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('resultArea').innerHTML = html;
}

function togglePastMonth(mid) {
  const row = document.getElementById(mid + '_row');
  const detail = document.getElementById(mid + '_detail');
  if (!row || !detail) return;
  row.classList.toggle('open');
  detail.classList.toggle('open');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('searchInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

loadData();
</script>
</body>
</html>
